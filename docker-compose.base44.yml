services:
  web:
    image: node:22-slim
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected without rebuilds.
    volumes:
      - ./:/app
      # Keep installed deps out of the bind mount's host path
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3000
      - NODE_ENV=development
      # Let Vite accept the preview's external hostname/origin.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    command: sh -c "npm install --no-audit --no-fund && npx tsx server.ts"
    restart: unless-stopped

volumes:
  node_modules:
